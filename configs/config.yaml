# TrendCast Pro · 金融市场预测模型 全局配置
# ================================
# 面向推理引擎、训练、评估、报告、API、调度等完整功能
# 数据源优先级：wind / tencent / simulation

project:
  name: "TrendCast Pro"
  version: "2.0.0"
  seed: 42

# 数据配置
data:
  # 数据源（按顺序回退）：wind / tencent / simulation
  source: ["simulation"]
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  news_dir: "data/news"

  # 多市场标的
  markets:
    stock:
      enabled: true
      symbols: ["600519.SH", "000858.SZ", "300308.SZ", "601088.SH", "600276.SH"]
    futures:
      enabled: false
      symbols: ["RB.SHF", "CU.SHF"]
    forex:
      enabled: false
      symbols: ["USDCNH.FXCM"]

  start_date: "2020-01-01"
  end_date: "2026-06-27"
  target: "return_5d"

  # 多周期预测
  prediction_horizons:
    short_term: 5
    mid_term: 10
    long_term: 20

  split_ratio:
    train: 0.7
    val: 0.15
    test: 0.15

  # 宏观指标数据源（CPI/PMI/GDP/M2/LPR）
  # 回退链: wind(需 Key) -> akshare(免费, 可选依赖) -> local(data/macro/*.csv)
  macro:
    source: ["wind", "akshare", "local"]
    dir: "data/macro"
    timeout: 15
    indicators: ["cpi", "pmi", "gdp", "m2", "lpr"]

# 特征工程
features:
  # 宏观指标特征注入（需 data.macro 有可用数据；无数据时注入显式零值）
  macro_enabled: false

  # 情感 / 宏观开关（兼容旧键，等价于 features.macro_enabled）
  sentiment_enabled: false

  technical:
    ma_windows: [5, 10, 20, 60]
    rsi_window: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    bollinger_window: 20
    bollinger_std: 2
  returns:
    windows: [1, 3, 5, 10, 20]
  volatility:
    windows: [5, 10, 20]
  volume:
    ma_windows: [5, 10, 20]
  time:
    day_of_week: true
    month: true
    quarter: true

# 模型配置
model:
  type: "lightgbm"           # lightgbm / pytorch_lstm / ensemble
  # ================================
  # Q2 多因子模型（src/factors）
  # ================================
  # 与 `strategy_gate`（IC 门禁）配合：门禁决定信号能否上调仓，
  # 本段决定"因子如何加权组合成预测"。
  factors:
    enabled: false              # true 时训练/推理接入可训练的多因子模型
    families:                   # 参与合成的因子族
      - trend
      - momentum
      - volatility
      - volume
      - reversal
      - sentiment
      - macro
    zscore_window: 252          # 滚动 z-score 窗口（仅用历史，无前视）
    smoothing: 5                # 因子平滑窗口，抑制单日噪音
    top_n: 8                    # 每个因子族最多保留的因子数
    min_abs_ic: 0.005           # 低于该 |IC| 的因子不参与加权
    level2_shrink: 0.35         # 族内权重向等权收缩比例，防单一因子过度集中
    family_weights: {}          # 显式族权重（留空 = 由 |IC| 自动估计）
    factor_weights: {}          # 显式因子权重（留空 = 由 |IC| 自动估计）
    # 类级加权组合：最终得分 = Σ w_class × 该类得分
    ensemble:
      classes: [factor, tree, sequence]
      weights:
        factor: 0.40            # IC 加权因子组合
        tree: 0.35              # LightGBM
        sequence: 0.25          # LSTM
      proba_clip: [0.02, 0.98]  # 概率裁剪，防极端值主导融合
  timesfm:
    enabled: false           # 可选依赖，真实启用需安装 timesfm[torch]
    model_name: "google/timesfm-2.5-200m-pytorch"
    context_days: 252
    verbose: false
  ensemble:
    models: ["lightgbm"]     # 参与集成的模型
    voting: "soft"
    tfm_weight: 0.4
  lightgbm:
    objective: "binary"
    n_estimators: 200
    learning_rate: 0.01
    max_depth: 6
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 0.1
    early_stopping_rounds: 50
    verbose: -1
  pytorch_lstm:
    input_size: 32
    hidden_size: 64
    num_layers: 2
    dropout: 0.2
    output_size: 1
    learning_rate: 0.001
    weight_decay: 1.0e-5   # YAML 必须带小数点，否则解析为字符串（optimizer 会报类型错）
    epochs: 5
    batch_size: 64
    sequence_length: 20

# 训练配置
training:
  use_gpu: false
  num_workers: 0
  log_interval: 10
  save_dir: "models"
  adaptive_learning:
    enabled: true
    drift_threshold: 0.05
    auto_retrain: true
    monitor_interval: "daily"

# 评估配置
evaluation:
  metrics: ["accuracy", "precision", "recall", "f1", "auc"]
  financial_metrics: ["sharpe_ratio", "max_drawdown", "win_rate", "profit_factor"]

# 导出配置
export:
  format: "onnx"            # onnx / torchscript
  output_dir: "models/exported"

# API 配置
api:
  host: "0.0.0.0"
  port: 8800

# 报告配置
report:
  output_dir: "reports"
  daily_report: true
  weekly_report: true

# 调度配置
scheduler:
  frequency: "weekly"       # daily / weekly / monthly
  time: "23:00"
  day: "sun"
  drift_threshold: 0.1
  auto_retrain_on_drift: true

# 审计配置
audit:
  output_dir: "logs/audit"

# 通知配置
notification:
  webhook_url: ""
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 587
    username: ""
    password: ""
    to: []

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: "logs/training.log"

# ================================
# 量化交易适配层配置 (src/trading)
# ================================
# 将 TrendCast 预测适配为可执行交易信号 / 订单流，供外部量化程序消费
trading:
  # 信号聚合
  signal:
    horizon_weights:            # 各预测周期在综合信号中的权重（自动归一化）
      short_term: 0.30
      mid_term: 0.35
      long_term: 0.35
    buy_threshold: 0.25         # 综合得分 >= 该值 → BUY
    sell_threshold: -0.25       # 综合得分 <= 该值 → SELL
    allow_short: true           # 是否允许做空(SELL)；false 时仅看多/观望

  # 风险管理
  risk:
    capital: 1000000            # 账户资金
    risk_per_trade_pct: 0.01    # 单笔可承受亏损占资金比例
    sizing_method: fixed_fractional   # fixed_fractional / kelly
    base_position_pct: 0.10     # 固定分数法基础仓位
    max_position_pct: 0.20      # 单标的最大仓位上限
    max_kelly_fraction: 0.25    # 凯利法上界截断
    stop_loss_pct: 0.03         # 止损比例（相对入场价）
    take_profit_pct: 0.06       # 止盈比例（相对入场价）

  # 智能风控建议（src/trading/risk_advice.py，Q4 路线）
  # 在 RiskManager 的"仓位算多少"之上，回答"止损止盈定多少/定在哪"。
  # 只产出建议（suggested_*），不改动 RiskManager / OrderGenerator 的任何行为。
  # 重要：门禁未放行（readonly/unknown）时不产出可直接使用的价位（fail-close）。
  risk_advice:
    atr_window: 14            # ATR 窗口（真实波幅均值）
    atr_stop_mult: 2.0        # 止损 = ATR × 倍数（与结构位取更保守者）
    atr_take_mult: 3.0        # 止盈 = ATR × 倍数（实际以盈亏比下界与阻力位孰近为准）
    support_lookback: 20      # 支撑/阻力回看窗口（交易日，不含当日）
    support_buffer: 0.005     # 结构位缓冲比例（避免贴边被扫）
    min_stop_pct: 0.015       # 止损比例下限（防过紧被噪音打掉）
    max_stop_pct: 0.12        # 止损比例上限（防过宽失去风控意义）
    min_risk_reward: 1.5      # 盈亏比下界，低于该值建议放弃而非放宽止损
    vol_target_pct: 0.015     # 日波动目标，用于对仓位建议做波动缩放
    min_bars: 30              # 最少日K根数，不足则如实标注不给数

  # 订单生成
  order:
    order_type: market          # market / limit
    attach_sl_tp: true          # 是否附带止损/止盈条件单

  # 轻量回测
  backtest:
    fee: 0.001                  # 每边手续费比例
    initial_capital: 1000000    # 回测初始资金

  # 数据输出目录（适配层导出物）
  output_dir: "output/trading"

# ================================
# Q3 路线：实时数据流接入 与 信号一致性
# ================================

# 实时数据流（src/data/streaming.py + src/inference/intraday.py）
# 定位：**盘中观测与预警**，不是盘中下单决策。
# 分钟级更新回答的问题是「今天开盘后的走势，是否让昨收模型的观点失真」。
streaming:
  enabled: false            # 默认关闭：需显式开启才会轮询实时源
  poll_seconds: 60          # 轮询间隔（秒）；盘中按此频率拉快照
  quote_timeout: 5          # 实时快照接口超时（秒）
  realtime_dir: "data/realtime"   # 快照落盘目录（与 data/raw 严格分离，绝不混入日K缓存）
  retention_days: 30        # 快照保留天数，超期自动清理
  # 盘中观点失真判定：相对昨收的反向波动超过该幅度即标记 stale
  drift_notional: 0.01
  # 日K缓存落后超过该天数时，拒绝据此给盘中结论（节假日容忍）
  max_stale_days: 5
  # 分钟级滚动特征窗口
  ma_fast: 5
  ma_slow: 20
  vol_window: 20
  rsi_window: 14
  min_bars: 30

# 信号一致性校验（src/monitor/signal_consistency.py）
# 检查跨周期 / 跨模型 / 跨口径给出的方向是否自相矛盾。
# 仅作观测，**不参与策略门禁**（门禁仍只看 IC / 命中率）。
consistency:
  tolerance: 0.15           # 跨口径强度差距容忍带
  neutral_band: 0.02        # 概率/得分中性带，带内视为"无观点"，不参与一致性判定
  ignore_short_term: true   # 短周期噪声大：跨周期一致性只看中/长周期（仅有短期时以短期为准）

# ================================
# Q2 路线：多因子集成 与 策略门禁
# ================================

# 多因子加权组合预测（src/inference/factor_combiner.py）
model_factors:
  weighter: "static"        # static(静态权重) / ic(按 |IC| 自适应权重)
  weights:                  # 因子权重（自动归一化；缺失因子会被移出后重归一化）
    lightgbm: 0.45          # 模型因子：LightGBM 概率
    timesfm: 0.25           # 模型因子：TimesFM 概率
    momentum: 0.10          # 特征因子：20 日动量分位
    trend: 0.10             # 特征因子：MA20 偏离分位
    volume: 0.05            # 特征因子：量比
    volatility: 0.05        # 特征因子：20 日波动率分位（取负）

# 策略门禁（src/trading/gate.py）
# 判定信号能否从「只读观测」升级为「调仓打分因子」；未达标一律 fail-close 保持只读
strategy_gate:
  enabled: true
  # 门禁未放行时交易适配层不发订单（默认关闭，避免历史判定静默改变下单行为）
  enforce_trading: false
  force_readonly: false     # true = 人工锁定只读（即使指标达标也不放行）
  scope: "all"              # all(所有周期都达标) / any(任一周期达标)
  min_ic: 0.03              # |IC| 下限（Spearman 秩相关）
  min_hit_rate: 0.52        # 方向命中率下限
  min_samples: 30           # 单周期最少样本数
  min_windows: 3            # ICIR 计算所需最少滚动窗口数
  use_audit: false          # 是否叠加「预测审计命中率」交叉验证
  min_audit_verified: 10    # 审计交叉验证所需最少已验证样本
  min_audit_hit_rate: 0.5   # 审计命中率下限
  report_dir: "reports"     # 判定结果输出目录（strategy_gate.json）
