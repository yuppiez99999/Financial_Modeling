# TrendCast Pro · 金融市场预测模型 全局配置
# ================================
# 面向推理引擎、训练、评估、报告、API、调度等完整功能
# 数据源优先级：wind / tencent / simulation

project:
  name: "TrendCast Pro"
  version: "2.0.0"
  seed: 42

# 数据配置
data:
  # 数据源（按顺序回退）：wind / tencent / simulation
  source: ["simulation"]
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  news_dir: "data/news"

  # 多市场标的
  markets:
    stock:
      enabled: true
      symbols: ["600519.SH", "000858.SZ", "300308.SZ", "601088.SH", "600276.SH"]
    futures:
      enabled: false
      symbols: ["RB.SHF", "CU.SHF"]
    forex:
      enabled: false
      symbols: ["USDCNH.FXCM"]

  start_date: "2020-01-01"
  end_date: "2026-06-27"
  target: "return_5d"

  # 多周期预测
  prediction_horizons:
    short_term: 5
    mid_term: 10
    long_term: 20

  split_ratio:
    train: 0.7
    val: 0.15
    test: 0.15

  # 宏观指标数据源（CPI/PMI/GDP/M2/LPR）
  # 回退链: wind(需 Key) -> akshare(免费, 可选依赖) -> local(data/macro/*.csv)
  macro:
    source: ["wind", "akshare", "local"]
    dir: "data/macro"
    timeout: 15
    indicators: ["cpi", "pmi", "gdp", "m2", "lpr"]

# 特征工程
features:
  # 宏观指标特征注入（需 data.macro 有可用数据；无数据时注入显式零值）
  macro_enabled: false

  # 情感 / 宏观开关（兼容旧键，等价于 features.macro_enabled）
  sentiment_enabled: false

  technical:
    ma_windows: [5, 10, 20, 60]
    rsi_window: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    bollinger_window: 20
    bollinger_std: 2
  returns:
    windows: [1, 3, 5, 10, 20]
  volatility:
    windows: [5, 10, 20]
  volume:
    ma_windows: [5, 10, 20]
  time:
    day_of_week: true
    month: true
    quarter: true

# 模型配置
model:
  type: "lightgbm"           # lightgbm / pytorch_lstm / ensemble
  timesfm:
    enabled: false           # 可选依赖，真实启用需安装 timesfm[torch]
    model_name: "google/timesfm-2.5-200m-pytorch"
    context_days: 252
    verbose: false
  ensemble:
    models: ["lightgbm"]     # 参与集成的模型
    voting: "soft"
    tfm_weight: 0.4
  lightgbm:
    objective: "binary"
    n_estimators: 200
    learning_rate: 0.01
    max_depth: 6
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 0.1
    early_stopping_rounds: 50
    verbose: -1
  pytorch_lstm:
    input_size: 32
    hidden_size: 64
    num_layers: 2
    dropout: 0.2
    output_size: 1
    learning_rate: 0.001
    weight_decay: 1e-5
    epochs: 5
    batch_size: 64
    sequence_length: 20

# 训练配置
training:
  use_gpu: false
  num_workers: 0
  log_interval: 10
  save_dir: "models"
  adaptive_learning:
    enabled: true
    drift_threshold: 0.05
    auto_retrain: true
    monitor_interval: "daily"

# 评估配置
evaluation:
  metrics: ["accuracy", "precision", "recall", "f1", "auc"]
  financial_metrics: ["sharpe_ratio", "max_drawdown", "win_rate", "profit_factor"]

# 导出配置
export:
  format: "onnx"            # onnx / torchscript
  output_dir: "models/exported"

# API 配置
api:
  host: "0.0.0.0"
  port: 8800

# 报告配置
report:
  output_dir: "reports"
  daily_report: true
  weekly_report: true

# 调度配置
scheduler:
  frequency: "weekly"       # daily / weekly / monthly
  time: "23:00"
  day: "sun"
  drift_threshold: 0.1
  auto_retrain_on_drift: true

# 审计配置
audit:
  output_dir: "logs/audit"

# 通知配置
notification:
  webhook_url: ""
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 587
    username: ""
    password: ""
    to: []

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: "logs/training.log"

# ================================
# 量化交易适配层配置 (src/trading)
# ================================
# 将 TrendCast 预测适配为可执行交易信号 / 订单流，供外部量化程序消费
trading:
  # 信号聚合
  signal:
    horizon_weights:            # 各预测周期在综合信号中的权重（自动归一化）
      short_term: 0.30
      mid_term: 0.35
      long_term: 0.35
    buy_threshold: 0.25         # 综合得分 >= 该值 → BUY
    sell_threshold: -0.25       # 综合得分 <= 该值 → SELL
    allow_short: true           # 是否允许做空(SELL)；false 时仅看多/观望

  # 风险管理
  risk:
    capital: 1000000            # 账户资金
    risk_per_trade_pct: 0.01    # 单笔可承受亏损占资金比例
    sizing_method: fixed_fractional   # fixed_fractional / kelly
    base_position_pct: 0.10     # 固定分数法基础仓位
    max_position_pct: 0.20      # 单标的最大仓位上限
    max_kelly_fraction: 0.25    # 凯利法上界截断
    stop_loss_pct: 0.03         # 止损比例（相对入场价）
    take_profit_pct: 0.06       # 止盈比例（相对入场价）

  # 订单生成
  order:
    order_type: market          # market / limit
    attach_sl_tp: true          # 是否附带止损/止盈条件单

  # 轻量回测
  backtest:
    fee: 0.001                  # 每边手续费比例
    initial_capital: 1000000    # 回测初始资金

  # 数据输出目录（适配层导出物）
  output_dir: "output/trading"
