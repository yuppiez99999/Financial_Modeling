# TrendCast Pro 专业版配置文件
# ================================

project:
  name: "TrendCast Pro - 金融市场预测模型"
  version: "2.0.0"
  edition: "professional"
  seed: 42

# 数据配置
data:
  # 数据源回退链: Wind(机构级, 优先) -> akshare(免费多市场: A股/ETF/期货/外汇)
  #              -> 腾讯(免费A股/ETF 备用通道) -> 模拟(兜底)
  # S14/G4：akshare 由可选依赖升为 P1，成为**唯一覆盖期货与外汇的免费档**；
  # 同时与腾讯形成 A股/ETF 双通道，可交叉识别单源前复权退化。
  # 未安装 akshare 时自动跳过（不报错），链路与升级前一致。
  source: ["wind", "akshare", "tencent", "simulation"]
  raw_dir: "data/raw"
  processed_dir: "data/processed"

  # 多市场标的（对齐 28 终极量化交易系统持仓池，2026-09-09 实测口径 26 只）
  markets:
    stock:
      enabled: true
      symbols:
        # === 28 持仓池 — 个股（12只） ===
        - "688041.SH"   # 海光信息（国产算力芯片）
        - "300308.SZ"   # 中际旭创（光模块）
        - "002371.SZ"   # 北方华创（半导体设备）
        - "603019.SH"   # 中科曙光（算力）
        - "300033.SZ"   # 同花顺（金融信息服务）
        - "300782.SZ"   # 卓胜微（射频芯片）
        - "688017.SH"   # 澜起科技（内存接口芯片）
        - "300274.SZ"   # 阳光电源（光储）
        - "000408.SZ"   # 藏格矿业（钾锂资源）
        - "601088.SH"   # 中国神华（煤炭）
        - "600276.SH"   # 恒瑞医药（创新药）
        - "600900.SH"   # 长江电力（水电）
        # === 28 持仓池 — ETF（14只） ===
        - "588080.SH"   # 科创50ETF
        - "512880.SH"   # 证券ETF
        - "510050.SH"   # 上证50ETF
        - "512800.SH"   # 银行ETF
        - "515030.SH"   # 新能源车ETF
        - "512760.SH"   # 芯片ETF
        - "512170.SH"   # 医疗ETF
        - "518880.SH"   # 黄金ETF
        - "588000.SH"   # 科创50ETF(华夏)
        - "510300.SH"   # 沪深300ETF
        - "510500.SH"   # 中证500ETF
        - "512100.SH"   # 中证1000ETF
        - "159915.SZ"   # 创业板ETF
        - "511010.SH"   # 国债ETF

    futures:
      # S14/G4：akshare(futures_zh_daily_sina) 已实测支持以下全部主连代码，
      # 免费档即可覆盖，故开启（此前因腾讯源不支持 RB.SHF 等而关闭）。
      enabled: true
      symbols:
        - "RB.SHF"      # 螺纹钢
        - "CU.SHF"      # 铜
        - "AU.SHF"      # 黄金
        - "SC.INE"      # 原油
        - "I.DCE"       # 铁矿石
        - "M.DCE"       # 豆粕
        - "Y.DCE"       # 豆油
        - "P.DCE"       # 棕榈油
        - "C.DCE"       # 玉米
        - "SR.CZC"      # 白糖

    forex:
      # S14/G4：akshare 通道（新浪外汇日K）已实测支持 USDCNH/USDCNY 等，
      # 开启后数据侧不再是瓶颈（此前仅 Wind MCP 支持，默认关）。
      # 代码后缀 .FXCM 保留（沿用既有口径），实际取数走 akshare 外汇通道。
      enabled: true
      symbols:
        - "USDCNH.FXCM"  # 美元兑离岸人民币
        - "USDCNY.FXCM"  # 美元兑在岸人民币

  # 时间范围（end_date 留空 = 采集至最新交易日）
  start_date: "2020-01-01"
  end_date: ""

  # 数据质量门控（基于 Token A级数据训练的质量模型）
  quality_gate: true

  # 宏观指标数据源（CPI/PMI/GDP/M2/LPR）
  # 回退链: wind(需 WIND_API_KEY) -> akshare(免费, pip install akshare) -> local(data/macro/*.csv)
  # local 兜底：离线/无网环境下读取人工维护的历史 CSV（列: date,value）
  macro:
    source: ["wind", "akshare", "local"]
    dir: "data/macro"
    timeout: 15
    indicators: ["cpi", "pmi", "gdp", "m2", "lpr"]

  # 预测目标
  target: "return_5d"
  forecast_horizon: 5

  # 短期 vs 长期预测
  prediction_horizons:
    short_term: 5    # 短期：5日
    mid_term: 10     # 中期：10日
    long_term: 20    # 长期：20日

  # 训练/验证/测试分割比例
  split_ratio:
    train: 0.7
    val: 0.15
    test: 0.15

# 特征工程（专业版启用扩展指标库 50+）
features:
  # 启用专业版扩展指标
  extended_indicators: true

  # 启用新闻情感分析特征（禁用：优先使用 Wind MCP，跳过慢速网页抓取）
  sentiment_enabled: false

  # 启用宏观指标特征 (CPI/PMI/GDP)
  macro_enabled: true

  # 基础技术指标
  technical:
    ma_windows: [5, 10, 20, 60]
    rsi_window: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    bollinger_window: 20
    bollinger_std: 2

  # 收益率特征
  returns:
    windows: [1, 3, 5, 10, 20]

  # 波动率特征
  volatility:
    windows: [5, 10, 20]

  # 成交量特征
  volume:
    ma_windows: [5, 10, 20]

  # 时间特征
  time:
    day_of_week: true
    month: true
    quarter: true

# 模型配置
model:
  type: "lightgbm"
  # ================================
  # Q2 多因子模型（src/factors）
  # ================================
  # 与 `strategy_gate`（IC 门禁）配合：门禁决定信号能否上调仓，
  # 本段决定"因子如何加权组合成预测"。
  factors:
    enabled: true              # true 时训练/推理接入可训练的多因子模型
    families:                   # 参与合成的因子族
      - trend
      - momentum
      - volatility
      - volume
      - reversal
      - sentiment
      - macro
    zscore_window: 252          # 滚动 z-score 窗口（仅用历史，无前视）
    smoothing: 5                # 因子平滑窗口，抑制单日噪音
    top_n: 8                    # 每个因子族最多保留的因子数
    min_abs_ic: 0.005           # 低于该 |IC| 的因子不参与加权
    level2_shrink: 0.35         # 族内权重向等权收缩比例，防单一因子过度集中
    family_weights: {}          # 显式族权重（留空 = 由 |IC| 自动估计）
    factor_weights: {}          # 显式因子权重（留空 = 由 |IC| 自动估计）
    # S13/G3：qlib Alpha158 族因子供给器（report_only，缺省关闭）
    # true 时 FeatureEngineer 不变 —— factor_a158_* 仅在 `python main.py qlib-ab`
    # 命令内计算；纳入生产特征集须 T13.4 人工检查点批准后另行改造。
    qlib_alpha158:
      enabled: false
      families: [momentum, trend, volatility, volume, reversal]
    # S16/H1：保形预测区间（report_only，缺省关闭）
    # true 时**不改** FeatureEngineer / 信号链路 —— 区间与置信分只在
    # `python main.py conformal-interval` 命令内计算；纳入生产须 T16.4 人工检查点。
    conformal:
      enabled: false
      confidence_levels: [0.8, 0.9]   # 目标覆盖率档位（1 − alpha）
      conformity_score: "lac"         # 单周期二分类唯一严格有效的保形分数
      holdout_ratio: 0.3              # 保留期占比（与 T16.3 holdout_split 同段）
      calib_ratio_of_train_pool: 0.166667  # calibration 占训练池比例 → 整体约 60/10/30
    # 市场状态分层（S18 / H3）：HMM 状态识别（bull/range/bear），`python main.py regime`
    # 命令内计算；纳入生产特征/门禁须 T18.4 人工检查点（本段 enabled 缺省 false）。
    regime:
      enabled: false
      n_states: 3             # 固定 3 态（写死防「扫 n_states 挑好看的那个」选择自由度回流）
      window: 20              # 状态观测回看窗口（日收益滚动波动率）
      refit_every: 20         # expanding 无前视口径的重训步长（交易日，步长内沿用最近模型）
      holdout_ratio: 0.3      # 分层评估所用保留期占比（与 T16.3/T16.1 同段）
      lookahead_mode: "expanding"  # expanding(严格无前视) / full_sample(仅对照，有前视)
    # 类级加权组合：最终得分 = Σ w_class × 该类得分
    ensemble:
      classes: [factor, tree, sequence]
      weights:
        factor: 0.40            # IC 加权因子组合
        tree: 0.35              # LightGBM
        sequence: 0.25          # LSTM
      proba_clip: [0.02, 0.98]  # 概率裁剪，防极端值主导融合

  lightgbm:
    objective: "binary"
    n_estimators: 800
    learning_rate: 0.005
    max_depth: 8
    num_leaves: 63
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 0.1
    early_stopping_rounds: 50
    verbose: -1

  pytorch_lstm:
    input_size: 60
    hidden_size: 128
    num_layers: 3
    dropout: 0.3
    output_size: 1
    learning_rate: 0.001
    weight_decay: 1.0e-5   # YAML 必须带小数点，否则解析为字符串（optimizer 会报类型错）
    epochs: 100
    batch_size: 64
    sequence_length: 20

  ensemble:
    models: ["lightgbm", "pytorch_lstm"]
    voting: "soft"

# 训练配置
training:
  use_gpu: false
  num_workers: 0
  log_interval: 10
  save_dir: "models"

  # 自适应学习配置
  adaptive_learning:
    enabled: true
    drift_threshold: 0.05
    auto_retrain: true
    monitor_interval: "daily"

# 评估配置
evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - auc
  financial_metrics:
    - sharpe_ratio
    - max_drawdown
    - win_rate
    - profit_factor

# 导出配置
export:
  format: "onnx"
  output_dir: "models/exported"

# 报告配置
report:
  output_dir: "reports"
  daily_report: true
  weekly_report: true

# Web API 配置
api:
  host: "0.0.0.0"
  port: 8800

# 信号推送通知配置
notification:
  # Webhook 推送（支持 generic/dingtalk/feishu/wechat）
  webhook_url: ""          # 填入你的 Webhook 地址
  webhook_type: "feishu"   # 飞书
  # 邮件推送 (SMTP)
  smtp_host: ""            # 如 smtp.gmail.com
  smtp_port: 465
  smtp_user: ""
  smtp_password: ""
  email_from: ""
  email_to: []             # ["recipient@example.com"]

# 自动重训练调度配置
scheduler:
  frequency: "weekly"      # daily/weekly/monthly
  time: "23:00"
  day: "sun"               # mon/tue/.../sun (weekly 模式)
  drift_threshold: 0.1     # 命中率下降 10% 触发漂移重训练
  auto_retrain_on_drift: true

# 审计配置
audit:
  dir: "logs/audit"

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: "logs/training_pro.log"

# ================================
# 量化交易适配层配置 (src/trading)
# ================================
# 将 TrendCast 预测适配为可执行交易信号 / 订单流，供外部量化程序消费
trading:
  # 信号聚合
  signal:
    horizon_weights:            # 各预测周期在综合信号中的权重（自动归一化）
      short_term: 0.30
      mid_term: 0.35
      long_term: 0.35
    buy_threshold: 0.25         # 综合得分 >= 该值 → BUY
    sell_threshold: -0.25       # 综合得分 <= 该值 → SELL
    allow_short: true           # 是否允许做空(SELL)；false 时仅看多/观望

  # 风险管理
  risk:
    capital: 1000000            # 账户资金
    risk_per_trade_pct: 0.01    # 单笔可承受亏损占资金比例
    sizing_method: fixed_fractional   # fixed_fractional / kelly
    base_position_pct: 0.10     # 固定分数法基础仓位
    max_position_pct: 0.20      # 单标的最大仓位上限
    max_kelly_fraction: 0.25    # 凯利法上界截断
    stop_loss_pct: 0.03         # 止损比例（相对入场价）
    take_profit_pct: 0.06       # 止盈比例（相对入场价）

  # 智能风控建议（src/trading/risk_advice.py，Q4 路线）
  # 在 RiskManager 的"仓位算多少"之上，回答"止损止盈定多少/定在哪"。
  # 只产出建议（suggested_*），不改动 RiskManager / OrderGenerator 的任何行为。
  # 重要：门禁未放行（readonly/unknown）时不产出可直接使用的价位（fail-close）。
  risk_advice:
    atr_window: 14            # ATR 窗口（真实波幅均值）
    atr_stop_mult: 2.0        # 止损 = ATR × 倍数（与结构位取更保守者）
    atr_take_mult: 3.0        # 止盈 = ATR × 倍数（实际以盈亏比下界与阻力位孰近为准）
    support_lookback: 20      # 支撑/阻力回看窗口（交易日，不含当日）
    support_buffer: 0.005     # 结构位缓冲比例（避免贴边被扫）
    min_stop_pct: 0.015       # 止损比例下限（防过紧被噪音打掉）
    max_stop_pct: 0.12        # 止损比例上限（防过宽失去风控意义）
    min_risk_reward: 1.5      # 盈亏比下界，低于该值建议放弃而非放宽止损
    vol_target_pct: 0.015     # 日波动目标，用于对仓位建议做波动缩放
    min_bars: 30              # 最少日K根数，不足则如实标注不给数

  # 订单生成
  order:
    order_type: market          # market / limit
    attach_sl_tp: true          # 是否附带止损/止盈条件单

  # 轻量回测
  backtest:
    fee: 0.001                  # 每边手续费比例
    initial_capital: 1000000    # 回测初始资金

  # 数据输出目录（适配层导出物）
  output_dir: "output/trading"

# ================================
# Q3 路线：实时数据流接入 与 信号一致性
# ================================

# 实时数据流（src/data/streaming.py + src/inference/intraday.py）
# 定位：**盘中观测与预警**，不是盘中下单决策。
# 分钟级更新回答的问题是「今天开盘后的走势，是否让昨收模型的观点失真」。
streaming:
  enabled: false            # 默认关闭：需显式开启才会轮询实时源
  poll_seconds: 60          # 轮询间隔（秒）；盘中按此频率拉快照
  quote_timeout: 5          # 实时快照接口超时（秒）
  realtime_dir: "data/realtime"   # 快照落盘目录（与 data/raw 严格分离，绝不混入日K缓存）
  retention_days: 30        # 快照保留天数，超期自动清理
  # 盘中观点失真判定：相对昨收的反向波动超过该幅度即标记 stale
  drift_notional: 0.01
  # 日K缓存落后超过该天数时，拒绝据此给盘中结论（节假日容忍）
  max_stale_days: 5
  # 分钟级滚动特征窗口
  ma_fast: 5
  ma_slow: 20
  vol_window: 20
  rsi_window: 14
  min_bars: 30

# 信号一致性校验（src/monitor/signal_consistency.py）
# 检查跨周期 / 跨模型 / 跨口径给出的方向是否自相矛盾。
# 仅作观测，**不参与策略门禁**（门禁仍只看 IC / 命中率）。
consistency:
  tolerance: 0.15           # 跨口径强度差距容忍带
  neutral_band: 0.02        # 概率/得分中性带，带内视为"无观点"，不参与一致性判定
  ignore_short_term: true   # 短周期噪声大：跨周期一致性只看中/长周期（仅有短期时以短期为准）

# ================================
# Q2 路线：多因子集成 与 策略门禁
# ================================

# 多因子加权组合预测（src/inference/factor_combiner.py）
model_factors:
  weighter: "static"        # static(静态权重) / ic(按 |IC| 自适应权重)
  weights:                  # 因子权重（自动归一化；缺失因子会被移出后重归一化）
    lightgbm: 0.45          # 模型因子：LightGBM 概率
    timesfm: 0.25           # 模型因子：TimesFM 概率
    momentum: 0.10          # 特征因子：20 日动量分位
    trend: 0.10             # 特征因子：MA20 偏离分位
    volume: 0.05            # 特征因子：量比
    volatility: 0.05        # 特征因子：20 日波动率分位（取负）

# 策略门禁（src/trading/gate.py）
# 判定信号能否从「只读观测」升级为「调仓打分因子」；未达标一律 fail-close 保持只读
strategy_gate:
  enabled: true
  # 门禁未放行时交易适配层不发订单（默认关闭，避免历史判定静默改变下单行为）
  enforce_trading: false
  force_readonly: false     # true = 人工锁定只读（即使指标达标也不放行）
  scope: "all"              # all(所有周期都达标) / any(任一周期达标)
  min_ic: 0.03              # |IC| 下限（Spearman 秩相关）
  min_hit_rate: 0.52        # 方向命中率下限
  min_samples: 30           # 单周期最少样本数
  min_windows: 3            # ICIR 计算所需最少滚动窗口数
  use_audit: false          # 是否叠加「预测审计命中率」交叉验证
  min_audit_verified: 10    # 审计交叉验证所需最少已验证样本
  min_audit_hit_rate: 0.5   # 审计命中率下限
  report_dir: "reports"     # 判定结果输出目录（strategy_gate.json）
  # S15/G5 T15.3：置信度子集门禁（"置信度 ≥thr 子集命中率 + 覆盖率下限"双指标）
  # ⚠️ 默认 report_only：只产出决策材料，**不改变** strategy_gate 结构与放行结论。
  #    落地该结构属产品口径变更，必须人工签字（`main.py confidence-gate --decided-by`）。
  confidence_gate:
    mode: "report_only"     # report_only(只产出决策材料) / enforce(结构变更由人工落配置)
    thr_min: 0.2            # 候选阈值区间下限（Issue #29 指令：thr ∈ [0.2, 0.3]）
    thr_max: 0.3            # 候选阈值区间上限
    min_hit_rate: 0.52      # 双指标之一：子集命中率下限（与 strategy_gate.min_hit_rate 同源）
    min_coverage: 0.05      # 双指标之二：覆盖率下限（防"只留几个样本 100%"退化解）
    min_samples: 50         # 单阈值行最少样本数（不足不发指标，不猜）
    max_report_age_days: 7  # 保留期报告最大可接受年龄（超龄→stale，证据不可复现）
    freeze_structure: true  # true = 冻结 strategy_gate 结构，禁止自动改（须人工落配置）
    report_dir: "reports"   # 决策单输出目录（confidence_gate_decision.json）

  # S7 门禁解锁：训练折中性带（过滤 ≈0.5 的噪音样本，仅用训练折学常数，无前视）
  # S9 按资产类别分池放行（默认关闭 = 分池只做补充证据，不改放行结论）
  pool_scope:
    enabled: false
    mode: "report_only"       # report_only(只报告) / per_class(每个分池各自过线才放行)
  neutral_band:
    enabled: false          # true = 评估/门禁启用训练折中性带（默认关闭，保持既有口径）
    min_keep_ratio: 0.5     # 至少保留多少比例的样本，防"只留 1 个 → 命中率 100%"的退化解

# IC 趋势 / 信号衰减监控（src/monitor/ic_trend.py，Q5）
# 门禁只看「此刻 IC 是否达标」；本段决定「IC 在变好还是变坏」的判定口径
# 分池门禁（S9 按资产类别分池）：把 S7 的实测结论「整池被木桶短板绑架」落成可复算证据
# ⚠️ 默认 `report_only`：分池结果**不改变** strategy_gate 的放行结论，只是补充证据。
#    想按分池各自放行，必须显式 enabled: true + mode: per_class，
#    且**每个分池各自过线**才算放行（绝不"取最好看的那个池子"代表全体）。
pool_gate:
  min_symbols: 2          # 分池最少标的数（低于此只记指标不判定，单标的池化 IC 无跨标的代表性）
  min_samples: 30         # 分池单周期最少有效样本
  report_dir: "reports"   # 分池报告输出目录（stratified_gate.json）
  # 识别不了的自定义代码在此手工归类：{"MY.CODE": "stock"}
  symbol_class_map: {}

# 分池训练（S9）：每个资产类别训一套独立模型
# ⚠️ fallback_to_pooled 默认 false = 分池样本不足时**如实拒答**，不静默回退整池模型
#    （静默回退会让"分层"变成空话：以为拿到 ETF 专用模型，其实是整池模型）
pool_train:
  enabled: true
  min_samples: 200        # 单分池最少样本行数（低于则不训，如实标注 insufficient_data）
  fallback_to_pooled: false
  save_dir: ""            # 留空 = 跟随 training.save_dir，产物落在 <save_dir>/pools/


horizon_scan:
  # 候选周期（交易日）。5/10/20 = 现行门禁口径；40/60 = S9 实测发现的强势区间。
  # 仅扫描并报告，**不改变** data.prediction_horizons 与门禁放行结论。
  candidates: [5, 10, 20, 40, 60]
  min_samples: 30         # 单周期最少有效样本（低于则不给结论）
  report_dir: "reports"   # 扫描报告输出目录（horizon_scan.json）


# 预测周期切换的决策前置（src/eval/horizon_decision.py，S11）
# S10 只能回答「换周期看起来有没有用」；本段决定「这个结论经不经得起多重比较校正」
# 特征扩充正交对照实验（src/eval/feature_experiment.py，S12）
# 回答「加横截面/宏观/情感特征到底有没有用」：逐族对照 + 多重比较校正，不自动改特征集
feature_experiment:
  arms: [cross_sectional, macro, sentiment]  # 对照臂（缺列的臂如实标注"未测"）
  max_family_p: 0.05          # 族错误率上限（Bonferroni 校正后仍须 <= 该值才判显著）
  min_ic_delta: 0.0           # 采纳所需的最小 IC 增量（0 = 只要显著为正即可）
  report_dir: "reports"       # 实验报告输出目录（feature_experiment.json）

# 评估试验登记（src/eval/trial_registry.py，S13）
# 多重比较校正只能数"本次"比较；这里把历史试验次数落成 append-only 事实
# 发布态健康检查（src/monitor/release_check.py，S14）
# 把门禁/趋势/扫描/决策单/对照实验/试验登记收敛成一条可执行判断
release_check:
  report_dir: "reports"          # 检查结果输出目录（release_check.json）
  state_file: "logs/alert_state.json"  # 告警去重状态（只记上一次的待处理项标识）
  channel: "webhook"             # 告警渠道（复用 notification 配置）
  max_scan_age_days: 7           # 扫描报告最大可接受年龄（天）
  max_trend_age_days: 30         # IC 趋势报告最大可接受年龄（天）

trial_registry:
  dir: "logs"                 # 登记目录（trials.jsonl，append-only，勿手改）
  filename: "trials.jsonl"

horizon_decision:
  max_family_p: 0.05          # 族错误率上限（Bonferroni/Holm 校正后仍须 <= 该值才判显著）
  min_samples: 30             # 单候选最少样本（低于则不作证据）
  max_report_age_days: 7      # 扫描报告最大可接受年龄（天），超龄 → 决策单标记 stale
  freeze_current_horizons: true  # true = 未经人工确认不得改 data.prediction_horizons
  report_dir: "reports"       # 决策单输出目录（horizon_decision.json）

ic_trend:
  window: 250          # 每个锚点的 IC 观察窗（样本数）
  step: 40             # 锚点之间的步长（样本数）
  min_anchors: 5       # 判定趋势所需的最少锚点数（不足则 unknown，不臆测）
  min_obs: 50          # 单锚点最少有效样本（低于则不参与趋势）
  min_decay: 0.001     # 显著衰减判定：每步 |IC| 下滑超过该值才算 decaying
  neutral_band: 0.0    # 命中率观望带（与门禁口径保持一致）
  report_dir: "reports"  # 趋势报告输出目录（ic_trend.json）
  # 监控/日报中「预计 N 步内跌破门禁线」告警的步数阈值
  near_breach_steps: 3
